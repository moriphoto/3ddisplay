<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WEfold placement admin</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    :root { --paper: #f4f1ea; --ink: #1c1c1c; --mute: #6d6a64; --line: #e4dfd6; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Helvetica, Arial, sans-serif; background: var(--paper); color: var(--ink); }
    main { display: grid; grid-template-columns: 300px 1fr; min-height: 100vh; }
    aside { padding: 18px; border-right: 1px solid var(--line); }
    h1 { font-size: 20px; margin: 0 0 6px; }
    p { color: var(--mute); font-size: 13px; line-height: 1.4; }
    label { display: block; font-size: 12px; letter-spacing: 0.04em; margin: 12px 0 4px; }
    select, button, input { font: inherit; }
    select, button { width: 100%; padding: 8px 10px; border: 1px solid var(--line); background: white; border-radius: 8px; }
    button { margin-top: 8px; cursor: pointer; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    model-viewer { width: 100%; height: 100vh; min-height: 520px; background: #f7f5f0; }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; }
      model-viewer { height: 62vh; }
    }
  </style>
</head>
<body>
  <main>
    <aside>
      <h1>Placement admin</h1>
      <p>The board uses the same viewer as the public page. Upload a print, then rotate or flip the selected side. Swap exchanges the two faces of that side.</p>
      <label>Side</label>
      <select id="side">
        <option value="Print_Back">Outside, Side A</option>
        <option value="Print_Front">Inside, Side B</option>
      </select>
      <label>Upload an image</label>
      <input id="file" type="file" accept="image/png,image/jpeg" />
      <div class="row">
        <button id="rotCw" type="button">Rotate clockwise</button>
        <button id="rotCcw" type="button">Rotate anti-clockwise</button>
      </div>
      <div class="row">
        <button id="flipV" type="button">Flip vertical</button>
        <button id="flipH" type="button">Flip horizontal</button>
      </div>
      <button id="swap" type="button">Swap left and right images</button>
      <button id="initiate" type="button">Initiate for GitHub</button>
      <p id="status">Loading the board.</p>
    </aside>
    <model-viewer id="board" src="WEfold_2.0_CPI7.glb" camera-controls touch-action="pan-y" shadow-intensity="0.4" environment-image="neutral" exposure="1" camera-orbit="32deg 78deg auto" min-camera-orbit="auto 78deg 90%" max-camera-orbit="auto 78deg 118%"></model-viewer>
  </main>
  <script type="module">
    const board = document.querySelector("#board");
    const status = document.querySelector("#status");
    const images = { Print_Back: null, Print_Front: null };
    const place = {
      Print_Back: { rot: 0, flipH: false, flipV: false, swapped: false },
      Print_Front: { rot: 0, flipH: false, flipV: false, swapped: false }
    };

    board.addEventListener("load", () => { status.textContent = "Board loaded. Upload a PNG or JPG."; });
    board.addEventListener("error", () => { status.textContent = "The board file did not load. Refresh the page."; });

    function side() { return document.querySelector("#side").value; }

    function draw(which) {
      const src = images[which];
      if (!src) return Promise.resolve(null);
      const s = place[which];
      const canvas = document.createElement("canvas");
      const portrait = src.height >= src.width;
      canvas.width = portrait ? src.width : src.height;
      canvas.height = portrait ? src.height : src.width;
      const ctx = canvas.getContext("2d");
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.rotate(s.rot);
      ctx.scale(s.flipH ? -1 : 1, s.flipV ? -1 : 1);
      ctx.drawImage(src, -src.width / 2, -src.height / 2);
      if (s.swapped) {
        const half = document.createElement("canvas");
        half.width = canvas.width;
        half.height = canvas.height;
        const h = half.getContext("2d");
        h.drawImage(canvas, canvas.width / 2, 0, canvas.width / 2, canvas.height, 0, 0, canvas.width / 2, canvas.height);
        h.drawImage(canvas, 0, 0, canvas.width / 2, canvas.height, canvas.width / 2, 0, canvas.width / 2, canvas.height);
        return new Promise((resolve) => half.toBlob((blob) => resolve(URL.createObjectURL(blob))));
      }
      return new Promise((resolve) => canvas.toBlob((blob) => resolve(URL.createObjectURL(blob))));
    }

    async function apply(which) {
      const url = await draw(which);
      if (!url || !board.model) return;
      const texture = await board.createTexture(url);
      board.model.materials.forEach((mat) => {
        if (mat.name === which) mat.pbrMetallicRoughness.baseColorTexture.setTexture(texture);
      });
    }

    document.querySelector("#file").onchange = (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const img = new Image();
      img.onload = async () => {
        images[side()] = img;
        await apply(side());
        status.textContent = file.name + " is on the selected side.";
      };
      img.src = URL.createObjectURL(file);
    };
    document.querySelector("#rotCw").onclick = () => { place[side()].rot += Math.PI / 2; apply(side()); };
    document.querySelector("#rotCcw").onclick = () => { place[side()].rot -= Math.PI / 2; apply(side()); };
    document.querySelector("#flipV").onclick = () => { place[side()].flipV = !place[side()].flipV; apply(side()); };
    document.querySelector("#flipH").onclick = () => { place[side()].flipH = !place[side()].flipH; apply(side()); };
    document.querySelector("#swap").onclick = () => {
      place[side()].swapped = !place[side()].swapped;
      apply(side());
      status.textContent = place[side()].swapped ? "Left and right images swapped." : "Left and right images restored.";
    };
    document.querySelector("#initiate").onclick = () => {
      const blob = new Blob([JSON.stringify(place, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "wefold-placement.json";
      link.click();
      status.textContent = "Placement saved. Send that file here and I will push it to GitHub.";
    };
  </script>
</body>
</html>
