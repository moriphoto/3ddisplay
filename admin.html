<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WEfold placement admin</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    :root { --paper: #f4f1ea; --ink: #1c1c1c; --mute: #6d6a64; --line: #e4dfd6; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Helvetica, Arial, sans-serif; background: var(--paper); color: var(--ink); }
    main { display: grid; grid-template-columns: 320px 1fr; min-height: 100vh; }
    aside { padding: 18px; border-right: 1px solid var(--line); }
    h1 { font-size: 20px; margin: 0 0 6px; }
    p { color: var(--mute); font-size: 13px; line-height: 1.4; }
    label { display: block; font-size: 12px; letter-spacing: 0.04em; margin: 12px 0 4px; }
    select, button, input { font: inherit; }
    select, button { width: 100%; padding: 8px 10px; border: 1px solid var(--line); background: white; border-radius: 8px; }
    button { margin-top: 8px; cursor: pointer; }
    input[type="color"] { width: 100%; height: 36px; border: 1px solid var(--line); background: white; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    model-viewer { width: 100%; height: 100vh; min-height: 520px; background: #f7f5f0; }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; }
      model-viewer { height: 62vh; }
    }
  </style>
</head>
<body>
  <main>
    <aside>
      <h1>Placement admin</h1>
      <p>Choose a panel or the footer. Upload, flip, or rotate that area only. The rest of the sheet stays. Reset puts that side back.</p>
      <label>Side</label>
      <select id="side">
        <option value="Print_Back">Outside, Side A</option>
        <option value="Print_Front">Inside, Side B</option>
      </select>
      <label>Target</label>
      <select id="target">
        <option value="left">Left panel only</option>
        <option value="right">Right panel only</option>
        <option value="footer">Footer</option>
      </select>
      <label>Colour</label>
      <input id="colour" type="color" value="#163a8a" />
      <button id="applyColour" type="button">Apply colour to target</button>
      <label>Upload image</label>
      <input id="file" type="file" accept="image/png,image/jpeg" />
      <div class="row">
        <button id="flipH" type="button">Flip horizontal</button>
        <button id="rotCw" type="button">Rotate clockwise</button>
      </div>
      <button id="rotCcw" type="button">Rotate anti-clockwise</button>
      <button id="swap" type="button">Swap left and right images</button>
      <button id="reset" type="button">Reset this side</button>
      <button id="initiate" type="button">Initiate for GitHub</button>
      <p id="status">Loading the board.</p>
    </aside>
    <model-viewer id="board" src="WEfold_2.0_CPI7.glb" camera-controls touch-action="pan-y" shadow-intensity="0.4" environment-image="neutral" exposure="1" camera-orbit="32deg 78deg auto" min-camera-orbit="auto 78deg 90%" max-camera-orbit="auto 78deg 118%"></model-viewer>
  </main>
  <script type="module">
    const board = document.querySelector("#board");
    const status = document.querySelector("#status");
    const bases = {};
    const sheets = {};
    const regions = {
      left: { x: 0, y: 0, w: 0.5, h: 0.8 },
      right: { x: 0.5, y: 0, w: 0.5, h: 0.8 },
      footer: { x: 0, y: 0.8, w: 1, h: 0.2 }
    };

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }
    function sheetFrom(img) {
      const canvas = document.createElement("canvas");
      canvas.width = img.width;
      canvas.height = img.height;
      canvas.getContext("2d").drawImage(img, 0, 0);
      return canvas;
    }
    function side() { return document.querySelector("#side").value; }
    function target() { return document.querySelector("#target").value; }

    function paint(which, region, draw) {
      const canvas = sheets[which];
      const box = regions[region];
      const x = box.x * canvas.width;
      const y = box.y * canvas.height;
      const w = box.w * canvas.width;
      const h = box.h * canvas.height;
      const ctx = canvas.getContext("2d");
      ctx.save();
      ctx.beginPath();
      ctx.rect(x, y, w, h);
      ctx.clip();
      draw(ctx, x, y, w, h);
      ctx.restore();
    }

    async function apply(which) {
      if (!board.model) return;
      const url = await new Promise((resolve) => sheets[which].toBlob((blob) => resolve(URL.createObjectURL(blob))));
      const texture = await board.createTexture(url);
      board.model.materials.forEach((mat) => {
        if (mat.name === which) mat.pbrMetallicRoughness.baseColorTexture.setTexture(texture);
      });
    }

    Promise.all([loadImage("side-a.png"), loadImage("side-b.png")]).then(([a, b]) => {
      bases.Print_Back = a;
      bases.Print_Front = b;
      sheets.Print_Back = sheetFrom(a);
      sheets.Print_Front = sheetFrom(b);
      status.textContent = "Board ready. Choose a panel or the footer.";
    }).catch(() => { status.textContent = "The print files did not load. Refresh the page."; });

    board.addEventListener("load", () => { status.textContent = "Board loaded. Choose a panel or the footer."; });

    document.querySelector("#applyColour").onclick = () => {
      const colour = document.querySelector("#colour").value;
      paint(side(), target(), (ctx, x, y, w, h) => { ctx.fillStyle = colour; ctx.fillRect(x, y, w, h); });
      apply(side());
      status.textContent = "Colour applied.";
    };

    document.querySelector("#file").onchange = (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const img = new Image();
      img.onload = () => {
        paint(side(), target(), (ctx, x, y, w, h) => ctx.drawImage(img, x, y, w, h));
        apply(side());
        status.textContent = file.name + " is on the " + target() + ".";
      };
      img.src = URL.createObjectURL(file);
    };

    document.querySelector("#flipH").onclick = () => {
      paint(side(), target(), (ctx, x, y, w, h) => {
        const cut = sheets[side()].getContext("2d").getImageData(x, y, w, h);
        const temp = document.createElement("canvas");
        temp.width = w; temp.height = h;
        temp.getContext("2d").putImageData(cut, 0, 0);
        ctx.save();
        ctx.translate(x + w, y);
        ctx.scale(-1, 1);
        ctx.drawImage(temp, 0, 0);
        ctx.restore();
      });
      apply(side());
      status.textContent = "Flipped horizontal.";
    };

    function rotate(dir) {
      paint(side(), target(), (ctx, x, y, w, h) => {
        const cut = sheets[side()].getContext("2d").getImageData(x, y, w, h);
        const temp = document.createElement("canvas");
        temp.width = w; temp.height = h;
        temp.getContext("2d").putImageData(cut, 0, 0);
        ctx.save();
        ctx.translate(x + w / 2, y + h / 2);
        ctx.rotate(dir * Math.PI / 2);
        ctx.drawImage(temp, -w / 2, -h / 2);
        ctx.restore();
      });
      apply(side());
      status.textContent = dir > 0 ? "Rotated clockwise." : "Rotated anti-clockwise.";
    }
    document.querySelector("#rotCw").onclick = () => rotate(1);
    document.querySelector("#rotCcw").onclick = () => rotate(-1);

    document.querySelector("#swap").onclick = () => {
      const canvas = sheets[side()];
      const left = regions.left;
      const right = regions.right;
      const ctx = canvas.getContext("2d");
      const lw = left.w * canvas.width;
      const lh = left.h * canvas.height;
      const rx = right.x * canvas.width;
      const leftData = ctx.getImageData(0, 0, lw, lh);
      const rightData = ctx.getImageData(rx, 0, lw, lh);
      ctx.putImageData(rightData, 0, 0);
      ctx.putImageData(leftData, rx, 0);
      apply(side());
      status.textContent = "Left and right images swapped.";
    };

    document.querySelector("#reset").onclick = () => {
      sheets[side()] = sheetFrom(bases[side()]);
      apply(side());
      status.textContent = "This side is reset.";
    };

    document.querySelector("#initiate").onclick = () => {
      const link = document.createElement("a");
      link.href = sheets[side()].toDataURL("image/png");
      link.download = side() + "-placement.png";
      link.click();
      status.textContent = "Placement image saved. Send it here and I will push it to GitHub.";
    };
  </script>
</body>
</html>
