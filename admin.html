<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WEfold placement admin</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    :root { --paper: #f4f1ea; --ink: #1c1c1c; --mute: #6d6a64; --line: #e4dfd6; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Helvetica, Arial, sans-serif; background: var(--paper); color: var(--ink); }
    main { display: grid; grid-template-columns: 320px 1fr; min-height: 100vh; }
    aside { padding: 18px; border-right: 1px solid var(--line); }
    h1 { font-size: 20px; margin: 0 0 6px; }
    p { color: var(--mute); font-size: 13px; line-height: 1.4; }
    label { display: block; font-size: 12px; letter-spacing: 0.04em; margin: 12px 0 4px; }
    select, button, input { font: inherit; }
    select, button { width: 100%; padding: 8px 10px; border: 1px solid var(--line); background: white; border-radius: 8px; }
    button { margin-top: 8px; cursor: pointer; }
    input[type="color"] { width: 100%; height: 36px; border: 1px solid var(--line); background: white; }
    input[type="range"] { width: 100%; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    model-viewer { width: 100%; height: 100vh; min-height: 520px; background: #f7f5f0; }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; }
      model-viewer { height: 62vh; }
    }
  </style>
</head>
<body>
  <main>
    <aside>
      <h1>Placement admin</h1>
      <p>Select a panel, the footer, or the logo. A colour fills that area. An upload replaces it. The logo sits on top and can be transparent.</p>
      <label>Side</label>
      <select id="side">
        <option value="Print_Back">Outside, Side A</option>
        <option value="Print_Front">Inside, Side B</option>
      </select>
      <label>Target</label>
      <select id="target">
        <option value="left">Left panel only</option>
        <option value="right">Right panel only</option>
        <option value="footer">Footer</option>
        <option value="logo">Logo</option>
      </select>
      <label>Colour</label>
      <input id="colour" type="color" value="#163a8a" />
      <button id="applyColour" type="button">Apply colour to target</button>
      <label>Upload image or logo</label>
      <input id="file" type="file" accept="image/png,image/jpeg" />
      <label>Logo opacity</label>
      <input id="opacity" type="range" min="0.1" max="1" step="0.05" value="1" />
      <div class="row">
        <button id="logoUp" type="button">Logo up</button>
        <button id="logoDown" type="button">Logo down</button>
      </div>
      <div class="row">
        <button id="logoLeft" type="button">Logo left</button>
        <button id="logoRight" type="button">Logo right</button>
      </div>
      <div class="row">
        <button id="rotCw" type="button">Rotate clockwise</button>
        <button id="rotCcw" type="button">Rotate anti-clockwise</button>
      </div>
      <button id="swap" type="button">Swap left and right images</button>
      <button id="initiate" type="button">Initiate for GitHub</button>
      <p id="status">Loading the board.</p>
    </aside>
    <model-viewer id="board" src="WEfold_2.0_CPI7.glb" camera-controls touch-action="pan-y" shadow-intensity="0.4" environment-image="neutral" exposure="1" camera-orbit="32deg 78deg auto" min-camera-orbit="auto 78deg 90%" max-camera-orbit="auto 78deg 118%"></model-viewer>
  </main>
  <script type="module">
    const board = document.querySelector("#board");
    const status = document.querySelector("#status");
    const W = 1204, H = 2504, FOOT = 500;
    const sides = ["Print_Back", "Print_Front"];
    const art = {};
    sides.forEach((name) => {
      art[name] = { left: null, right: null, footer: null, logo: null, logoX: 0.72, logoY: 0.12, logoOpacity: 1, rot: 0 };
    });

    board.addEventListener("load", () => { status.textContent = "Board loaded. Choose a target."; });
    board.addEventListener("error", () => { status.textContent = "The board file did not load. Refresh the page."; });

    const side = () => document.querySelector("#side").value;
    const target = () => document.querySelector("#target").value;

    function compose(which) {
      const a = art[which];
      const canvas = document.createElement("canvas");
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#f4f1ea";
      ctx.fillRect(0, 0, W, H);
      const drawRegion = (img, x, y, w, h, colour) => {
        if (img) ctx.drawImage(img, x, y, w, h);
        else if (colour) { ctx.fillStyle = colour; ctx.fillRect(x, y, w, h); }
      };
      drawRegion(a.left && a.left.img, 0, 0, W / 2, H - FOOT, a.left && a.left.colour);
      drawRegion(a.right && a.right.img, W / 2, 0, W / 2, H - FOOT, a.right && a.right.colour);
      drawRegion(a.footer && a.footer.img, 0, H - FOOT, W, FOOT, a.footer && a.footer.colour);
      if (a.logo && a.logo.img) {
        ctx.save();
        ctx.globalAlpha = a.logoOpacity;
        const lw = W * 0.22;
        const lh = lw * (a.logo.img.height / a.logo.img.width);
        ctx.translate(a.logoX * W, a.logoY * H);
        ctx.rotate(a.rot);
        ctx.drawImage(a.logo.img, -lw / 2, -lh / 2, lw, lh);
        ctx.restore();
      }
      return new Promise((resolve) => canvas.toBlob((blob) => resolve(URL.createObjectURL(blob))));
    }

    async function apply(which) {
      if (!board.model) return;
      const url = await compose(which);
      const texture = await board.createTexture(url);
      board.model.materials.forEach((mat) => {
        if (mat.name === which) mat.pbrMetallicRoughness.baseColorTexture.setTexture(texture);
      });
    }

    document.querySelector("#applyColour").onclick = () => {
      const colour = document.querySelector("#colour").value;
      const t = target();
      if (t === "logo") return;
      art[side()][t] = { colour, img: null };
      apply(side());
      status.textContent = "Colour applied to the " + t + ".";
    };

    document.querySelector("#file").onchange = (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const img = new Image();
      img.onload = () => {
        const t = target();
        if (t === "logo") art[side()].logo = { img };
        else art[side()][t] = { img, colour: null };
        apply(side());
        status.textContent = file.name + " is on the " + t + ".";
      };
      img.src = URL.createObjectURL(file);
    };

    document.querySelector("#opacity").oninput = (event) => {
      art[side()].logoOpacity = Number(event.target.value);
      apply(side());
    };
    document.querySelector("#logoUp").onclick = () => { art[side()].logoY -= 0.04; apply(side()); };
    document.querySelector("#logoDown").onclick = () => { art[side()].logoY += 0.04; apply(side()); };
    document.querySelector("#logoLeft").onclick = () => { art[side()].logoX -= 0.04; apply(side()); };
    document.querySelector("#logoRight").onclick = () => { art[side()].logoX += 0.04; apply(side()); };
    document.querySelector("#rotCw").onclick = () => { art[side()].rot += Math.PI / 2; apply(side()); };
    document.querySelector("#rotCcw").onclick = () => { art[side()].rot -= Math.PI / 2; apply(side()); };
    document.querySelector("#swap").onclick = () => {
      const a = art[side()];
      const hold = a.left;
      a.left = a.right;
      a.right = hold;
      apply(side());
      status.textContent = "Left and right images swapped.";
    };
    document.querySelector("#initiate").onclick = () => {
      const blob = new Blob([JSON.stringify({ note: "Placement is visual. Send this with the images." }, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "wefold-placement.json";
      link.click();
      status.textContent = "Placement saved. Send it here and I will push it to GitHub.";
    };
  </script>
</body>
</html>
