<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WEfold placement admin</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    :root { --paper: #f4f1ea; --ink: #1c1c1c; --mute: #6d6a64; --line: #e4dfd6; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Helvetica, Arial, sans-serif; background: var(--paper); color: var(--ink); }
    main { display: grid; grid-template-columns: 320px minmax(0, 1fr); min-height: 100vh; }
    aside { padding: 18px; border-right: 1px solid var(--line); }
    h1 { font-size: 20px; margin: 0 0 6px; }
    p { color: var(--mute); font-size: 13px; line-height: 1.4; }
    label { display: block; font-size: 12px; letter-spacing: 0.04em; margin: 12px 0 4px; }
    select, button, input { font: inherit; }
    select, button { width: 100%; padding: 8px 10px; border: 1px solid var(--line); background: white; border-radius: 8px; }
    button { margin-top: 8px; cursor: pointer; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    #stage { min-width: 0; }
    model-viewer { width: 100%; height: 100vh; min-height: 520px; background: #f7f5f0; display: block; }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; }
      model-viewer { height: 62vh; }
    }
  </style>
</head>
<body>
  <main>
    <aside>
      <h1>Placement admin</h1>
      <p>Upload the full print. It is placed across both panels and split at the centre, using the cutter sheet.</p>
      <label>Side</label>
      <select id="side">
        <option value="Print_Back">Outside, Side A</option>
        <option value="Print_Front">Inside, Side B</option>
      </select>
      <label>Target</label>
      <select id="target">
        <option value="left">Left panel only</option>
        <option value="right">Right panel only</option>
        <option value="footer">Footer</option>
      </select>
      <label><input id="group" type="checkbox" /> Group left and right panels</label>
      <label>Upload image</label>
      <input id="file" type="file" accept="image/png,image/jpeg,application/pdf" />
      <div class="row">
        <button id="flipH" type="button">Flip horizontal</button>
        <button id="rotCw" type="button">Rotate clockwise</button>
      </div>
      <button id="rotCcw" type="button">Rotate anti-clockwise</button>
      <button id="swap" type="button">Swap left and right images</button>
      <button id="reset" type="button">Reset this side</button>
      <button id="download" type="button">Download spinning page</button>
      <p id="status">Editor starting.</p>
    </aside>
    <div id="stage">
      <model-viewer id="board" src="WEfold_2.0_Split.glb" camera-controls touch-action="pan-y" shadow-intensity="0.4" environment-image="neutral" exposure="1" camera-orbit="32deg 78deg auto"></model-viewer>
    </div>
  </main>
  <script src="admin.js?v=18"></script>
</body>
</html>
