<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WEfold gallery</title>
  <style>
    body { margin: 0; font-family: Helvetica, Arial, sans-serif; background: #f4f1ea; color: #1c1c1c; }
    main { max-width: 880px; margin: 0 auto; padding: 28px 20px; }
    h1 { font-size: 32px; margin: 0 0 8px; }
    p { color: #6d6a64; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin-top: 18px; }
    article { background: #fff; border: 1px solid #e4dfd6; border-radius: 16px; padding: 14px; }
    a { color: #1c1c1c; }
  </style>
</head>
<body>
  <main>
    <p>WORLDENTIRE</p>
    <h1>Gallery</h1>
    <p>Each saved version is a viewer. Open the link on any computer.</p>
    <div class="grid" id="list"></div>
  </main>
  <script>
    const list = document.getElementById("list");
    fetch("/.netlify/functions/gallery").then((r) => r.json()).then((items) => {
      if (!items.length) { list.innerHTML = "<p>No versions yet.</p>"; return; }
      items.forEach((item) => {
        const card = document.createElement("article");
        card.innerHTML = "<strong>" + item.name + "</strong><br><a href='" + item.url + "'>Open viewer</a>";
        list.appendChild(card);
      });
    }).catch(() => { list.innerHTML = "<p>Gallery could not load.</p>"; });
  </script>
</body>
</html>
