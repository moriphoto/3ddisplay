<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WEfold gallery</title>
  <style>
    body { margin: 0; font-family: Helvetica, Arial, sans-serif; background: #f6f3ee; color: #1c1c1c; }
    main { max-width: 980px; margin: 0 auto; padding: 40px 24px 64px; }
    img { width: 148px; }
    .eye { letter-spacing: 0.16em; font-size: 11px; color: #6d6a64; }
    h1 { font-size: 40px; font-weight: 500; margin: 6px 0 8px; }
    p { color: #6d6a64; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-top: 28px; }
    article { background: #fff; border: 1px solid #e4dfd6; border-radius: 18px; overflow: hidden; }
    iframe { width: 100%; height: 220px; border: 0; background: #f7f5f0; }
    div { padding: 14px 16px 16px; display: flex; justify-content: space-between; align-items: center; }
    a { color: #1c1c1c; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img src="worldentire.png" alt="WorldEntire">
    <p class="eye">WORLDENTIRE</p>
    <h1>Gallery</h1>
    <p>Saved WEfold 2.0 viewers. Open one on any computer.</p>
    <div class="grid" id="list"></div>
  </main>
  <script>
    const list = document.getElementById("list");
    fetch("/.netlify/functions/gallery").then((r) => r.json()).then((items) => {
      if (!items.length) { list.innerHTML = "<p>No versions yet.</p>"; return; }
      items.forEach((item) => {
        const card = document.createElement("article");
        const src = "/.netlify/functions/gallery?id=" + encodeURIComponent(item.id);
        card.innerHTML = "<a href='" + src + "'><iframe src='" + src + "' loading='lazy'></iframe><div><strong>" + item.name + "</strong><span>Open</span></div></a>";
        list.appendChild(card);
      });
    }).catch(() => { list.innerHTML = "<p>Gallery could not load.</p>"; });
  </script>
</body>
</html>
